    <text x="24" y="74" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">annual pipeline cost</text>

    <rect x="255" y="0" width="230" height="95" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="279" y="45" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">14h → 10 min</text>
    <text x="279" y="74" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">legacy ETL runtime</text>

    <rect x="510" y="0" width="230" height="95" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="534" y="45" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">£100K / yr</text>
    <text x="534" y="74" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">billing revenue saved</text>

    <rect x="765" y="0" width="195" height="95" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="789" y="45" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">9+ yrs</text>
    <text x="789" y="74" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">data engineering</text>
