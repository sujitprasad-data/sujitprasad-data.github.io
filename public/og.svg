      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#101014"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect x="60" y="60" width="1080" height="510" rx="20" fill="#18181b" stroke="#27272a" stroke-width="2"/>
  <text x="120" y="150" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="4">LEAD DATA ENGINEER · BENGALURU, INDIA</text>
